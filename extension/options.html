<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Najm Downloader — Options</title>
  <style>
    :root { --accent:#b5562f; --line:#e3dfd5; --muted:#777267; --bg:#fbfaf8; }
    * { box-sizing: border-box; }
    body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color:#26241f; max-width: 620px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    h2 { font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 22px; }
    label { display:block; margin-top: 12px; font-weight:600; font-size:13px; color:var(--muted); }
    input[type=text], select, input[type=number] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; margin-top:4px; }
    .check { display:flex; gap:8px; align-items:center; font-weight:400; color:#26241f; }
    input[type=checkbox]{ width:auto; margin:0; }
    button { margin-top:18px; padding:8px 16px; border:1px solid var(--line); border-radius:7px; background:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; margin-right:8px; }
    .status { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); margin-top:8px; }
    #saved { color:#3d7d4f; font-weight:600; }
  </style>
</head>
<body>
  <h1>Najm Downloader</h1>

  <h2>Defaults</h2>

  <label>Save downloads to
    <input type="text" id="outDir" placeholder="~/Videos">
  </label>

  <label class="check"><input type="checkbox" id="playlist"> Download playlists by default</label>

  <h2>Subtitles</h2>
  <label class="check"><input type="checkbox" id="subsOn"> Download subtitles by default</label>
  <label class="check"><input type="checkbox" id="auto"> Include auto-generated captions</label>

  <label>Default languages (comma-separated, e.g. en,ar)
    <input type="text" id="langs" placeholder="en">
  </label>

  <label class="check"><input type="checkbox" id="convertSrt"> Convert subtitles to SRT</label>
  <label class="check"><input type="checkbox" id="embed"> Embed subtitles into the video file</label>

  <div class="status" id="hostStatus"></div>
  <button id="save" class="primary">Save</button>
  <button id="reset">Reset to defaults</button>
  <span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
