<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Najm Downloader — Options</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="card">
    <header>
      <span class="brand"><span class="glyph">&#xF0DEA;</span>Najm Downloader</span>
      <span class="sub">Options</span>
    </header>

    <section>
      <h2 class="section-title">Defaults</h2>

      <label class="field-label" for="outDir">Save downloads to</label>
      <input type="text" id="outDir" placeholder="~/Videos">

      <label class="check">
        <input type="checkbox" id="playlist"> Download playlists by default
      </label>

      <label class="field-label" for="chapters">Video sections (chapters) by default</label>
      <select id="chapters">
        <option value="off">Don't store sections</option>
        <option value="embed">Embed as chapter markers</option>
        <option value="split">Split into separate files</option>
      </select>
    </section>

    <section>
      <h2 class="section-title">Subtitles</h2>
      <label class="check">
        <input type="checkbox" id="subsOn"> Download subtitles by default
      </label>
      <label class="check">
        <input type="checkbox" id="auto"> Include auto-generated captions
      </label>

      <label class="field-label" for="langs">Default languages (comma-separated, e.g. en,ar)</label>
      <input type="text" id="langs" placeholder="en">

      <label class="check">
        <input type="checkbox" id="convertSrt"> Convert subtitles to SRT
      </label>
      <label class="check">
        <input type="checkbox" id="embed"> Embed subtitles into the video file
      </label>
    </section>

    <footer>
      <div class="status" id="hostStatus"></div>
      <div class="actions">
        <button id="save" class="btn primary">Save</button>
        <button id="reset" class="btn">Reset to defaults</button>
        <span id="saved"></span>
      </div>
    </footer>
  </div>

  <script src="theme.js"></script>
  <script src="controls.js"></script>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
